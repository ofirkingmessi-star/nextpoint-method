<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Next Point · שיטת הבנייה</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Next Point">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Lexend:wght@500&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#0e0e0e;--panel:#171717;--panel2:#1f1f1f;--line:#2c2c2a;
 --text:#f4f3ee;--muted:#9d9b93;--dim:#6d6b65;
 --brand:#c8f03c;--brandInk:#111;--warn:#f2c14e;--bad:#ff8a7a;--ok:#c8f03c;
 --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Heebo,Arial,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
/* brand bar */
.top{position:sticky;top:0;z-index:20;background:rgba(14,14,14,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{direction:ltr;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.mark{width:34px;height:34px;border-radius:50%;background:#000;display:grid;place-items:center;border:1px solid #2a2a2a;flex:none}
.mark svg{display:block}
.word{font-family:Lexend,Heebo,sans-serif;font-weight:500;font-size:17px;letter-spacing:.2px}
.top .sp{flex:1}
.top .tag{font-size:13px;color:var(--muted)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:14px;color:var(--text)}
/* common */
h1{font-size:26px;line-height:1.2;margin:22px 0 4px;font-weight:800}
h2{font-size:18px;margin:0;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brandInk)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.hot{color:var(--bad);border-color:#5a2c26}
.chip.go{color:var(--brand);border-color:#45531b}
.chip.wait{color:var(--warn);border-color:#584816}
/* alerts */
.alert{border-radius:var(--r);padding:13px 15px;margin:10px 0;border:1px solid var(--line);background:var(--panel);display:flex;gap:10px;align-items:flex-start}
.alert b{display:block}
.alert .dot{width:9px;height:9px;border-radius:50%;margin-top:8px;flex:none}
.alert.bad{border-color:#5a2c26}.alert.bad .dot{background:var(--bad)}
.alert.warn{border-color:#584816}.alert.warn .dot{background:var(--warn)}
.alert.ok .dot{background:var(--brand)}
/* metrics */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.metric .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.metric .l{font-size:13px;color:var(--muted)}
.goal{height:6px;background:#262624;border-radius:9px;overflow:hidden;margin-top:6px}
.goal i{display:block;height:100%;background:var(--text);border-radius:9px}
/* client list */
.client{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:8px 0}
.client .nm{font-weight:700;font-size:16px}
.client .meta{font-size:13px;color:var(--muted)}
.client .grow{flex:1;min-width:0}
.client .arrow{color:var(--dim);font-size:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 4px}
details.closed summary{cursor:pointer;color:var(--muted);font-size:14px;padding:8px 0}
/* client page */
.back{background:none;border:0;color:var(--muted);padding:14px 0 0;font-size:15px}
.cl-head{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.action-box{border:1px solid #45531b;background:#151a08;border-radius:var(--r);padding:12px 14px;margin:12px 0}
.action-box .l{font-size:12px;color:var(--brand);font-weight:700;letter-spacing:.3px}
.action-box .v{font-weight:700;font-size:16px}
.action-box.empty{border-color:#584816;background:#1a1608}
.action-box.empty .l{color:var(--warn)}
.field{margin:12px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;background:#101010;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#77756d}
.field .hint{font-size:12px;color:var(--dim);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* stage tabs */
.tabs{position:sticky;top:59px;z-index:15;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin:6px 0 0;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:8px 13px;font-size:14px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.tab .p{font-size:12px;font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums}
.tab.on{background:var(--text);color:#111;border-color:var(--text)}
.tab.on .p{color:#555}
.tab.full .p{color:var(--brand)}
.tab.on.full .p{color:#4f6b00}
.stage-intro{margin:16px 0 6px}
.stage-intro .q{font-size:20px;font-weight:800;line-height:1.3}
.stage-intro .d{font-size:14px;color:var(--muted);margin-top:4px}
.prog{display:flex;align-items:center;gap:10px;margin:10px 0 4px}
.prog .bar{flex:1;height:6px;background:#262624;border-radius:9px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .2s}
.prog .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.filter{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 0}
/* groups + items */
.group{margin:18px 0 0}
.group-h{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin:0 0 6px;display:flex;justify-content:space-between}
.items{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-main{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;width:100%;background:none;border:0;text-align:right}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid #5e5c56;display:grid;place-items:center;margin-top:1px;font-size:15px;font-weight:800;color:var(--brandInk)}
.item.done .box{background:var(--brand);border-color:var(--brand)}
.item.na .box{border-style:dashed;color:var(--dim)}
.item .tx{flex:1;font-size:15px;line-height:1.45}
.item.done .tx{color:var(--muted)}
.item.na .tx{color:var(--dim);text-decoration:line-through}
.key{display:inline-block;font-size:11px;font-weight:800;color:var(--warn);margin-inline-start:6px;vertical-align:1px}
.new{display:inline-block;font-size:11px;font-weight:800;color:#8fc7ff;margin-inline-start:6px;vertical-align:1px}
.more{flex:none;background:none;border:1px solid var(--line);border-radius:8px;width:30px;height:30px;color:var(--muted);font-size:14px;font-weight:700;margin:-3px 0}
.why{display:none;padding:0 50px 14px 14px;font-size:14px;color:var(--muted)}
.item.open .why{display:block}
.why .ref{font-size:12px;color:var(--dim);margin-top:6px}
.why .na-btn{margin-top:8px;background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}
/* fit */
.fit-item{padding:13px 14px;border-top:1px solid var(--line)}
.fit-item:first-child{border-top:0}
.fit-q{font-size:15px;font-weight:500}
.fit-w{font-size:13px;color:var(--muted);margin-top:3px}
.yn{display:flex;gap:6px;margin-top:9px}
.yn button{flex:1;background:#101010;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:14px;font-weight:700;color:var(--muted)}
.yn button.y.on{background:var(--text);color:#111;border-color:var(--text)}
.yn button.n.on{background:#3a3a37;color:var(--text);border-color:#3a3a37}
.verdict{border-radius:var(--r);padding:16px;margin:16px 0;border:1px solid var(--line);background:var(--panel)}
.verdict .v{font-size:19px;font-weight:800;line-height:1.3}
.verdict .w{font-size:14px;color:var(--muted);margin-top:6px}
.verdict.go{border-color:#45531b;background:#151a08}.verdict.go .v{color:var(--brand)}
.verdict.mid{border-color:#584816;background:#1a1608}.verdict.mid .v{color:var(--warn)}
.verdict.no{border-color:#5a2c26;background:#1c0f0d}.verdict.no .v{color:var(--bad)}
/* message analyzer */
.msg textarea{min-height:200px;font-size:15px;line-height:1.6}
.checks{margin-top:10px;display:grid;gap:6px}
.ck{display:flex;gap:8px;font-size:14px;align-items:flex-start}
.ck .s{flex:none;width:18px;text-align:center;font-weight:800}
.ck.ok .s{color:var(--brand)}.ck.bad .s{color:var(--bad)}.ck.warn .s{color:var(--warn)}
/* bottom bar */
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(14,14,14,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bottom-in{max-width:720px;margin:0 auto;display:flex;gap:8px}
.bottom .btn{flex:1}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#111;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.quickbtn{width:100%;margin-top:16px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--brand);color:var(--brandInk);border:0;border-radius:var(--r);padding:14px 16px;font-weight:800;font-size:18px;text-align:right}
.quickbtn span{font-size:13px;font-weight:500}
.qrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.qrow .quickbtn{margin-top:0;font-size:16px}
.quickbtn.gen{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.quickbtn.gen span{color:var(--muted)}
.empty-state{text-align:center;color:var(--muted);padding:30px 10px}
.hide{display:none!important}
@media(min-width:700px){h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== מסך פתיחה: אותו מסך לוגו כמו בשאלון ההמשך (מסמך 28). פעם אחת בכל פתיחה של האפליקציה, לחיצה מדלגת. מהירות: --t ===== */
.splash{--t:1;position:fixed;inset:0;z-index:100;background:#111;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .6s cubic-bezier(.7,0,.2,1)}
.splash.out{transform:translateY(-100%)}
.splash .lg{direction:ltr;position:relative;width:176px;height:26px;margin-bottom:18px}
.splash .d1,.splash .d2{position:absolute;top:2px;width:22px;height:22px;border-radius:50%}
.splash .d1{left:0;background:var(--text);animation:sp-pop .35s ease both calc(.1s*var(--t))}
.splash .d2{right:0;background:var(--brand);animation:sp-pop .35s ease both calc(.95s*var(--t))}
.splash .d2::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--brand);animation:sp-ring .9s ease-out both calc(1s*var(--t))}
.splash .ln{position:absolute;left:16px;right:16px;top:12px;height:2px;background:var(--text);transform-origin:left;animation:sp-draw .55s cubic-bezier(.6,0,.2,1) both calc(.35s*var(--t))}
.splash .nm{direction:ltr;font:500 26px Lexend,Heebo,sans-serif;letter-spacing:.02em;animation:sp-up .5s ease both calc(1.05s*var(--t))}
.splash .ok{margin-top:40px;font-size:38px;font-weight:800;position:relative;padding-bottom:8px;animation:sp-up .5s ease both calc(1.4s*var(--t))}
.splash .ok::after{content:"";position:absolute;right:0;left:0;bottom:0;height:2px;background:var(--text);transform-origin:right;animation:sp-draw .5s cubic-bezier(.6,0,.2,1) both calc(1.75s*var(--t))}
.splash .nx{margin-top:12px;font-size:20px;color:#bdbab2;animation:sp-up .5s ease both calc(1.85s*var(--t))}
@keyframes sp-pop{from{opacity:0;transform:scale(.4)}}
@keyframes sp-draw{from{transform:scaleX(0)}}
@keyframes sp-up{from{opacity:0;transform:translateY(10px)}}
@keyframes sp-ring{from{transform:scale(1);opacity:.9}to{transform:scale(3);opacity:0}}
</style>
</head>
<body>

<div class="splash" id="splash" aria-hidden="true"><div class="lg"><span class="ln"></span><span class="d1"></span><span class="d2"></span></div><div class="nm">Next Point</div><div class="ok">בונים לפניות.</div><div class="nx">לא רק אתר יפה.</div></div>
<script>/* מסך הפתיחה: פעם אחת בכל פתיחה, לא בהפחתת תנועה */
(function(){const sp=document.getElementById('splash');let seen=false;try{seen=sessionStorage.getItem('np-splash')==='1';sessionStorage.setItem('np-splash','1')}catch(e){}
if(seen||matchMedia('(prefers-reduced-motion: reduce)').matches){sp.remove();return}
let on=true;const end=()=>{if(!on)return;on=false;sp.classList.add('out');setTimeout(()=>sp.remove(),650)};sp.onclick=end;setTimeout(end,2900)})();
</script>
<header class="top">
 <div class="top-in">
  <a class="logo" href="#" id="homeLink" aria-label="Next Point, לדף הבית">
   <span class="mark"><svg width="22" height="10" viewBox="0 0 22 10" aria-hidden="true"><circle cx="3.5" cy="5" r="3.2" fill="#f4f3ee"/><rect x="6.5" y="4.1" width="9" height="1.8" rx=".9" fill="#f4f3ee"/><circle cx="18.5" cy="5" r="3.2" fill="#c8f03c"/></svg></span>
   <span class="word">Next Point</span>
  </a>
  <span class="sp"></span>
  <span class="tag" id="topTag">שיטת הבנייה</span>
 </div>
</header>

<main class="wrap" id="app"></main>

<div class="bottom hide" id="bottom"><div class="bottom-in" id="bottomIn"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ התוכן: השיטה של Next Point ============
   key = סעיף שבלעדיו לא שולחים. new = הצעה חדשה שעוד לא נבדקה על לקוח. */
const STAGES = [
 {id:"fit", short:"התאמה", type:"fit",
  q:"האם הלקוח הזה ישלם על אתר?",
  d:"לפני שמשקיעים ימים בסקיצה. 6 פניות, 0 \"כן\": הבעיה הייתה בחירת הלקוח, לא איכות האתר.",
  core:[
   {id:"f1",t:"העסק כבר מכניס כסף",w:"יש מחיר, לקוחות משלמים, הזמנות או הופעות. מי שרק מתחיל: אין תקציב ואין דחיפות."},
   {id:"f2",t:"אנשים כבר מתעניינים ופונים אליו",w:"תגובות כמו \"כמה עולה?\" או \"איך נרשמים?\". אתר הופך מבקרים שכבר מגיעים לפניות. הוא לא מביא תנועה חדשה."},
   {id:"f3",t:"יש דליפה שאתר פותר, ואני יכול להצביע עליה",w:"מחיר או מידע מוסתר בהיילייט, קישור מקוצר, לא ברור למי זה מתאים, אין קישור לשלוח להורה. בלי דליפה ברורה אין לו סיבה לשלם."}
  ],
  extra:[
   {id:"f4",t:"יש מספיק חומר אמיתי",w:"תמונות שלו, רילס, המלצה או תוצאה. פחות מ-3 פוסטים = אתר מאולתר (הלקח של כפיר)."},
   {id:"f5",t:"יש סיבה לעכשיו",w:"הופעה, השקה, עונה, קמפיין. דחיפות הופכת \"יפה\" ל\"כן\"."}
  ],
  red:[
   {id:"r1",t:"כבר יש לו אתר סביר",w:"עומר וארז. ממשיכים רק אם יש חולשה ספציפית שאפשר להראות בצילום מסך."},
   {id:"r2",t:"הוא בונה לבד עם AI, או שיש לו צוות",w:"יונתן: \"אבנה לבד עם AI\"."},
   {id:"r3",t:"יוצר תוכן צעיר, מהסוג שכבר אמר לא",w:"5 מתוך 5 סירובים. עדיפות ראשונה: עסק מקומי שמרוויח ואין לו אתר (מותג, סעיף 3)."}
  ]},
 {id:"s1", short:"ניתוח", type:"list", brief:true,
  q:"מה הוא מוכר, למי, ומה עוצר פנייה היום?",
  d:"השדות למעלה הם התקציר. הם נכנסים לכל העתקה ל-Claude.",
  groups:[{h:"",items:[
   {id:"a1",key:1,t:"יש פעולה ראשית אחת, בערוץ שהוא כבר משתמש בו",w:"הודעת וואטסאפ, תור, שיחה או כרטיס. פעולות משניות קטנות ממנה ולא מתחרות בה. כל חלק באתר ייבחן לפיה.",ref:"כלל יסוד 8 · מסמך 30"},
   {id:"a2",key:1,t:"בדקתי מה עוצר פנייה היום, רק ממה שראיתי",w:"קישור מקוצר, אין מחיר, מידע בהיילייט, לא ברור למי זה מתאים. מה שלא ראיתי נרשם כהנחה.",ref:"מסמך 30, שלב 1"},
   {id:"a3",t:"שורת \"למי\" במילים שלו, או \"אין\"",w:"המצב של הקהל שלו, ומה הם כבר ניסו ולא עבד. בעסק מקומי: המקום ואיך מגיעים. לא ממציאים.",ref:"מסמך 30"},
   {id:"a4",t:"יש תמונה אמיתית שלו שחזקה מספיק לפתיחה",ref:"מסמך 24, סעיף 3.1"},
   {id:"a5",t:"לכל טענה שתעלה לפתיחה יש הוכחה",w:"לוגו של לקוח, דירוג בגוגל או צילום מסך. אין הוכחה: הטענה לא בפתיחה.",ref:"מסמך 24, סעיף 3.2א"},

/* ============ סנכרון דרך GitHub ============
   הנתונים נשמרים בקובץ פרטי (gist) בחשבון GitHub שלך. הקוד (token) נשמר רק במכשיר, לא בגיבוי. */
const SK="nextpoint_sync",FILE="nextpoint-method.json",GDESC="Next Point · נתוני שיטת הבנייה (פרטי)";
let SY={token:"",gist:"",last:0,first:true,err:""};
try{SY={...SY,...JSON.parse(localStorage.getItem(SK)||"{}")}}catch(e){}
const saveSY=()=>{try{localStorage.setItem(SK,JSON.stringify(SY))}catch(e){}};
async function gh(method,path,body){
 const r=await fetch("https://api.github.com"+path,{method,cache:"no-store",headers:{Authorization:"Bearer "+SY.token,Accept:"application/vnd.github+json",...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});
 if(r.status===401)throw new Error("הקוד לא תקין או שפג תוקפו");
 if(r.status===404)throw new Error("קובץ הנתונים לא נמצא");
 if(!r.ok)throw new Error("GitHub החזיר שגיאה "+r.status);
 return r.json();
}
const payload=()=>JSON.stringify({v:2,clients:S.clients,deleted:S.deleted});
function merge(R,first){
 const del={...S.deleted};Object.entries(R.deleted||{}).forEach(([k,t])=>{del[k]=Math.max(del[k]||0,t)});
 const map=new Map();
 const add=c=>{if(!c||!c.id)return;if(del[c.id]&&del[c.id]>=(c.u||0))return;const ex=map.get(c.id);if(!ex||(c.u||0)>(ex.u||0))map.set(c.id,c)};
 (R.clients||[]).forEach(add);S.clients.forEach(add);
 let list=[...map.values()];
 if(first){const byName=new Map();list.forEach(c=>{const n=(c.name||"").trim();const ex=byName.get(n);if(!ex||(c.u||0)>(ex.u||0))byName.set(n,c)});list=[...byName.values()]}
 S.clients=list;S.deleted=del;
}
let syncing=false,again=false,pendingRender=false;
async function sync(){
 if(!SY.token||!SY.gist)return;
 if(syncing){again=true;return}
 syncing=true;syncUI("מסנכרן…");
 try{
  const g=await gh("GET","/gists/"+SY.gist);
  const f=g.files&&g.files[FILE];let R={};
  if(f){const txt=f.truncated?await (await fetch(f.raw_url,{cache:"no-store"})).text():(f.content||"");try{R=JSON.parse(txt||"{}")}catch(e){R={}}}
  const before=JSON.stringify([S.clients,S.deleted]);
  merge(R,SY.first);SY.first=false;
  S.clients.forEach(c=>snap.set(c.id,sig(c)));
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  const out=payload();
  if(out!==JSON.stringify({v:2,clients:R.clients||[],deleted:R.deleted||{}}))await gh("PATCH","/gists/"+SY.gist,{files:{[FILE]:{content:out}}});
  SY.last=Date.now();SY.err="";saveSY();
  if(JSON.stringify([S.clients,S.deleted])!==before)softRender();
 }catch(e){SY.err=e.message||"אין חיבור";saveSY()}
 syncing=false;syncUI();
 if(again){again=false;sync()}
}

document.addEventListener("focusout",()=>setTimeout(()=>{if(pendingRender&&!(document.activeElement&&document.activeElement.matches("input,textarea,select"))){pendingRender=false;render()}},200));

 if(!SY.last)return "עוד לא סונכרן";

async function connect(token){

 syncUI("מתחבר…");
 try{
  let id="";
  for(let page=1;page<=3&&!id;page++){const list=await gh("GET","/gists?per_page=100&page="+page);const hit=list.find(x=>x.files&&x.files[FILE]);if(hit)id=hit.id;if(list.length<100)break}
  if(!id){const g=await gh("POST","/gists",{description:GDESC,public:false,files:{[FILE]:{content:payload()}}});id=g.id;SY.first=false}
  SY.gist=id;saveSY();await sync();toast(SY.err?SY.err:"מחובר ומסונכרן");

}

/* ============ בדיקת הודעה ============ */
function analyzeMsg(txt,c){
 const t=txt.trim();
 if(!t)return `<div class="muted small">הבדיקה תופיע כאן.</div>`;
 const words=t.split(/\s+/).filter(Boolean).length;
 const r=[];
 r.push(words<120?["warn",`${words} מילים. קצר מ-120: חסר ההפסד או הרווח?`]:words>180?["bad",`${words} מילים. ארוך מ-180: לקצר`]:["ok",`${words} מילים (בטווח 120–180)`]);
 r.push(/^\S*\s*(היי|הי|שלום|אהלן)?[^\n]{0,30}אני אופיר/.test(t)||/אני אופיר/.test(t.slice(0,80))?["ok","פותח ב\"אני אופיר\""]:["warn","לא מצאתי \"אני אופיר\" בהתחלה"]);
 r.push(/[?؟]\s*[\p{Emoji}\s]*$/u.test(t)?["ok","מסתיים בשאלה"]:["bad","לא מסתיים בשאלה. למשל: \"תסתכל מהטלפון ותגיד מה דעתך?\""]);
 r.push(/https?:\/\/|github\.io|netlify\.app/.test(t)?["ok","יש קישור לסקיצה"]:["warn","אין קישור. אם הוא נשלח בנפרד, זה בסדר"]);
 if(/\d+\s*%|\d[\d,]*\s*₪|\d+\s*פניות/.test(t))r.push(["warn","יש מספר, אחוז או סכום. לוודא שהוא מהפרופיל שלו ולא מומצא"]);
 if(c.handle&&t.includes(c.handle))r.push(["ok","מזכיר את שם המשתמש שלו"]);
 const found=BANNED.filter(([w])=>t.includes(w));
 if(found.length)found.forEach(([,l])=>r.push(["bad",`להוריד: ${l}`]));else r.push(["ok","אין ביטויים אסורים מהרשימה"]);
 return r.map(([s,x])=>`<div class="ck ${s}"><span class="s">${s==="ok"?"✓":s==="bad"?"✕":"!"}</span><span>${esc(x)}</span></div>`).join("")+`<div class="muted small" style="margin-top:6px">הבדיקה מוצאת מילים, לא מבינה טון. הסעיפים למטה בודקים את השאר.</div>`;
}

/* ============ העתקה ל-Claude ============ */
async function copyFor(c,st){
 const L=[];
 L.push(`Next Point · בדיקה לפי השיטה`);
 L.push(`לקוח: ${c.name}${c.handle?" (@"+c.handle+")":""} · סטטוס: ${c.status}`);
 BRIEF.forEach(b=>{const v=(c.brief[b.k]||"").trim();if(v)L.push(`${b.l}: ${v}`)});
 L.push("");
 L.push(`שלב: ${st.short}`);
 if(st.type==="fit"){
  [...st.core,...st.extra,...st.red].forEach(q=>L.push(`${c.fit[q.id]==="y"?"כן":c.fit[q.id]==="n"?"לא":"?"} · ${q.t}`));
  const v=fitVerdict(c);L.push("",`המסקנה של הכלי: ${v.v}`,"","בקשה: האם אתה מסכים עם המסקנה? אם לא, למה. תבדוק בפרופיל רק מה שסימנתי כ\"?\".");
 }else{
  const it=allItems(st);const p=stageProg(c,st);
  const open=it.filter(i=>!c.checks[i.id]);const na=it.filter(i=>c.checks[i.id]==="na");
  L.push(`הושלמו ${p.done}/${p.total}`);
  if(open.length){L.push("","פתוח:");open.forEach(i=>L.push(`- ${i.key?"[חובה] ":""}${i.t}${i.ref?` (${i.ref})`:""}`))}
  if(na.length){L.push("","לא רלוונטי ללקוח הזה:");na.forEach(i=>L.push(`- ${i.t}`))}
  if(st.type==="msg"&&c.msg.trim())L.push("","ההודעה:",c.msg.trim());
  L.push("",open.length?(st.type==="msg"?"בקשה: תבדוק את ההודעה מול הסעיפים הפתוחים ומסמך 27 סעיף 8. תקן רק מה שצריך.":"בקשה: עבור על הסעיפים הפתוחים, קודם [חובה]. לכל אחד: עובר או לא, ומה התיקון. תיקון שנוגע ביותר מחלק אחד: קודם תוכנית."):"בקשה: כל הסעיפים סומנו. תבדוק בעצמך את סעיפי [חובה] של השלב הזה, ותגיד אם משהו לא באמת עובר.");
 }
 const n=(c.notes[st.id]||"").trim();if(n)L.push("","הערות שלי:",n);
 const text=L.join("\n");
 try{await navigator.clipboard.writeText(text);toast("הועתק. הדבק בשיחה של הלקוח")}
 catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.append(ta);ta.select();try{document.execCommand("copy");toast("הועתק. הדבק בשיחה של הלקוח")}catch(_){toast("ההעתקה נחסמה בדפדפן")}ta.remove()}
}

  <div class="action-box ${act?"":"empty"}"><div class="l">${act?"הפעולה הראשית":"חסרה פעולה ראשית"}</div><div class="v">${act?esc(act):"בלי זה אין לפי מה לבדוק. ממלאים בשלב ניתוח."}</div></div>
  <div class="prog"><div class="bar"><i style="width:${done/all.length*100}%"></i></div><span class="t">${done}/${all.length}</span></div>
  ${QUICK.map(g=>`<div class="group"><div class="group-h"><span>${esc(g.h)}</span></div><div class="items">${g.items.map((i,n)=>{const d=qDone(c,i);return `<div class="item ${d?"done":""}"><button class="item-main" data-q="${esc(i.ids.join(","))}" aria-pressed="${d}"><span class="box">${d?"✓":""}</span><span class="tx">${esc(i.t)}</span></button></div>`}).join("")}</div></div>`).join("")}
  <p class="muted small" style="margin-top:16px">כל סימון כאן מסמן גם בצ'קליסט המלא. מה שנכשל: פותחים את המלא ולוחצים "?".</p>
  <button class="btn ghost" id="toFull" style="width:100%">לצ'קליסט המלא של ${esc(c.name)}</button>
 `;
 $("#back").onclick=()=>history.length&&view.from==="client"?go({page:"client",id:c.id}):go({page:"home"});
 $("#qc").onchange=e=>go({page:"quick",id:e.target.value});
 $("#toFull").onclick=()=>go({page:"client",id:c.id,stage:curStage(c)});
 document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const ids=b.dataset.q.split(",");const on=ids.every(k=>c.checks[k]==="done");ids.forEach(k=>{if(on)delete c.checks[k];else c.checks[k]="done"});save();const y=window.scrollY;renderQuick();window.scrollTo(0,y)});
 bottom(`<button class="btn primary" id="qcopy">העתק ל-Claude</button>`);
 $("#qcopy").onclick=async()=>{
  const open=all.filter(i=>!qDone(c,i));
  const L=[`Next Point · צ'קליסט מהיר`,`לקוח: ${c.name}${c.handle?" (@"+c.handle+")":""} · סטטוס: ${c.status}`,`פעולה ראשית: ${act||"לא נקבעה"}`,`עברו ${done}/${all.length}`];
  if(open.length){L.push("","לא עבר עדיין:");open.forEach(i=>L.push("- "+i.t));L.push("","בקשה: לכל סעיף שרלוונטי לשלב שבו אנחנו: עובר או לא, ומה התיקון. סעיפים של שלב שעוד לא הגענו אליו: לדלג.")}
  else L.push("","בקשה: הכול סומן. תבדוק בעצמך את 4 הסעיפים של הסקיצה ותגיד אם משהו לא באמת עובר.");
  const text=L.join("\n");
  try{await navigator.clipboard.writeText(text);toast("הועתק. הדבק בשיחה של הלקוח")}catch(e){toast("ההעתקה נחסמה בדפדפן")}
 };
}

/* ============ צ'קליסט כללי ============ */
function renderGeneral(){
 const c=S.clients.find(x=>x.id===view.id)||S.clients[0];if(!c)return go({page:"home"});
 if(S.lastId!==c.id){S.lastId=c.id;save()}
 $("#topTag").textContent="צ'קליסט כללי";
 const st={groups:GENERAL};const p=stageProg(c,st);
 $("#app").innerHTML=`
  <button class="back" id="back">› חזרה</button>
  <h1 style="margin-top:6px">צ'קליסט כללי</h1>
  <p class="muted small" style="margin:0">המבט הרחב, מהשיחה עם ChatGPT. לחיצה על "?" מראה את השאלות שמאחורי כל סעיף.</p>
  <div class="field"><label for="gc">לקוח</label><select id="gc">${S.clients.filter(x=>x.status!=="לא"||x.id===c.id).map(x=>`<option value="${x.id}" ${x.id===c.id?"selected":""}>${esc(x.name)} · ${esc(x.status)}</option>`).join("")}</select></div>
  <div class="prog"><div class="bar"><i style="width:${p.total?p.done/p.total*100:0}%"></i></div><span class="t">${p.done}/${p.total}</span></div>
  <section id="genBox">${GENERAL.map(g=>{const gd=g.items.filter(i=>c.checks[i.id]==="done").length;return `<div class="group"><div class="group-h"><span>${esc(g.h)}</span><span>${gd}/${g.items.length}</span></div><div class="items">${g.items.map(i=>itemHTML(c,i)).join("")}</div></div>`}).join("")}</section>
  <div class="alert" style="margin-top:16px"><span class="dot" style="background:var(--muted)"></span><div><b>3 שאלות לכל אלמנט שאתה מתלבט עליו</b><span class="muted small">למה הוא קיים? מה הוא גורם למבקר להבין או להרגיש? איך הוא עוזר לו להתקדם? אין תשובה טובה: כנראה מיותר.</span></div></div>
 `;
 $("#back").onclick=()=>view.from==="client"?go({page:"client",id:c.id}):go({page:"home"});
 $("#gc").onchange=e=>go({page:"general",id:e.target.value});
 const box=$("#genBox");
 const rer=()=>{const y=window.scrollY;renderGeneral();window.scrollTo(0,y)};
 box.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{const k=b.dataset.tog;if(c.checks[k]==="done")delete c.checks[k];else c.checks[k]="done";save();rer()});
 box.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>b.closest(".item").classList.toggle("open"));
 box.querySelectorAll("[data-na]").forEach(b=>b.onclick=()=>{const k=b.dataset.na;if(c.checks[k]==="na")delete c.checks[k];else c.checks[k]="na";save();rer()});
 bottom(`<button class="btn primary" id="gcopy">העתק ל-Claude</button>`);
 $("#gcopy").onclick=async()=>{
  const L=[`Next Point · צ'קליסט כללי`,`לקוח: ${c.name}${c.handle?" (@"+c.handle+")":""} · סטטוס: ${c.status}`,`פעולה ראשית: ${(c.brief.action||"").trim()||"לא נקבעה"}`,`הושלמו ${p.done}/${p.total}`];
  GENERAL.forEach(g=>{const open=g.items.filter(i=>!c.checks[i.id]);if(open.length){L.push("",g.h);open.forEach(i=>L.push("- "+i.t))}});
  L.push("",p.done<p.total?"בקשה: עבור על הסעיפים הפתוחים מול האתר. לכל אחד: עובר או לא, ומה התיקון.":"בקשה: הכול סומן. תבדוק בעצמך ותגיד אם משהו לא באמת עובר.");
  try{await navigator.clipboard.writeText(L.join("\n"));toast("הועתק. הדבק בשיחה של הלקוח")}catch(e){toast("ההעתקה נחסמה בדפדפן")}
 };
}

/* ============ ניווט ============ */
function bottom(h){$("#bottomIn").innerHTML=h;$("#bottom").classList.remove("hide")}
function render(){view.page==="client"?renderClient():view.page==="quick"?renderQuick():view.page==="general"?renderGeneral():renderHome()}
render();
sync();
if("serviceWorker" in navigator&&isSecureContext)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
